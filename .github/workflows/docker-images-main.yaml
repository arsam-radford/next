name: Docker Images Main

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-amd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: df -h
      - name: "node-cleanup"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: df -h
      # Login To GitHub Container Registry
      - name: Log in to the Container GHCR registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/arsam-radford/next:amd64

      - name: Build and push Docker image for node
        uses: docker/build-push-action@v6
        with:
          file: deployment/node_server/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/next:amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image for node_yjs
        uses: docker/build-push-action@v6
        with:
          file: deployment/node_yjs/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/next_yjs:amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image for node_files
        uses: docker/build-push-action@v6
        with:
          file: deployment/node_files/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/next_files:amd64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image for seer
        uses: docker/build-push-action@v6
        with:
          file: deployment/seer/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/agents:amd64
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-arm:
    # Needs upstream's self-hosted Mac runner; a fork has none and would queue forever.
    if: github.repository == 'SAGE-3/next'
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Login To GitHub Container Registry
      - name: Log in to the Container GHCR registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/arsam-radford/next:arm64

      - name: Build and push Docker image for node
        uses: docker/build-push-action@v6
        with:
          file: deployment/node_server/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/next:arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image for node_yjs
        uses: docker/build-push-action@v6
        with:
          file: deployment/node_yjs/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/next_yjs:arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image for node_files
        uses: docker/build-push-action@v6
        with:
          file: deployment/node_files/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/next_files:arm64
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image for seer
        uses: docker/build-push-action@v6
        with:
          file: deployment/seer/Dockerfile
          context: "{{defaultContext}}:."
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/arsam-radford/agents:arm64
          labels: ${{ steps.meta.outputs.labels }}
